<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Scroll World Showcase</title>
  <meta name="description" content="Scroll-world skill showcase" />
  <style>
    :root, .sw-root {
      --sw-bg: #F5EDE0; --sw-ink: #241d2b; --sw-ink-soft: #6a6072; --sw-accent: #8a7bb5;
      --sw-font-display: ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;
      --sw-font-body: system-ui,sans-serif;
    }
    html, body { margin: 0; background: var(--sw-bg); color: var(--sw-ink); font-family: var(--sw-font-body); }
    #top { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
  </style>
</head>
<body>
  <div id="top"></div>
  <div id="world"></div>

  <script src="scrub-engine.js"></script>
  <script>
    mountScrollWorld(document.getElementById('world'), {
      brand: { name: 'Scroll World', href: '#top' },
      hint: 'scroll to fly in',
      nav: true,
      atmosphere: true,
      sections: [
        {
          id: 'scene-a', label: '01',
          eyebrow: 'SKILL OVERVIEW',
          title: 'Scroll World',
          body: 'A scroll-scrubbed camera-flight engine driven by video frames, still fallbacks, and additive motion layers.',
          tags: ['Skill','Scrub engine','Standalone'],
          accent: '#E94560',
          still: 'assets/still_01.png', stillMobile: 'assets/still_01.png',
          clip: 'assets/vid/01.mp4', clipMobile: 'assets/vid/01.mp4',
          scroll: 1.6, linger: 0.15
        },
        {
          id: 'scene-b', label: '02',
          eyebrow: 'ENGINE',
          title: 'Scrub, don\'t play',
          body: 'One seek per raf per segment. LERP-driven, dissolve-keyed, mobile-aware, reduced-motion fallback to stills.',
          tags: ['requestAnimationFrame','seek','lerp'],
          accent: '#8a7bb5',
          still: 'assets/still_02.png', stillMobile: 'assets/still_02.png',
          clip: 'assets/vid/02.mp4', clipMobile: 'assets/vid/02.mp4',
          scroll: 1.4, linger: 0.2
        },
        {
          id: 'scene-c', label: '03',
          eyebrow: 'SOURCE',
          title: 'Open and forkable',
          body: 'Drop into any stack. Adapt sections, swap clips, retheme tokens. This page demonstrates drive from any hotlinkable MP4.',
          tags: ['MIT','Drop-in','Open source'],
          accent: '#9B7EBD',
          still: 'assets/still_03.png', stillMobile: 'assets/still_03.png',
          clip: 'assets/vid/03.mp4', clipMobile: 'assets/vid/03.mp4',
          scroll: 1.3, linger: 0.0
        }
      ],
      connectors: [],
      connectorsMobile: []
    });
  </script>
</body>
</html>
